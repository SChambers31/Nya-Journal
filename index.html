<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Journal Hub</title>
<style>
  :root{
    --bg:#faf8f4; --surface:#ffffff; --border:#e5e0d8; --border-soft:#efece5;
    --text:#2c2a26; --text2:#6b6558; --text3:#a39d8e;
    --accent:#7f6a4f; --accent-soft:#efe6d8; --accent-text:#5c4a33;
    --green:#5c7a5c; --green-soft:#e7edcf;
    --coral:#c1704f; --coral-soft:#f6e5db;
    --radius:14px; --radius-sm:9px;
    --serif: Georgia, 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1c1a17; --surface:#252220; --border:#3a352e; --border-soft:#2e2b26;
      --text:#ece7dc; --text2:#a39d8e; --text3:#756f61;
      --accent:#c7ab7f; --accent-soft:#3a3226; --accent-text:#e0c99a;
      --green:#8fae8a; --coral:#d98d6a; --coral-soft:#3a2a20;
    }
  }
  *{box-sizing:border-box;}
html{background-color:#F4F6F3;}
  body{
    margin:0;font-family:var(--sans);color:var(--text);
    background-color:#F4F6F3;
    position:relative;
  }
  body::before, body::after{
    content:"";
    position:fixed;
    width:380px;height:340px;
    pointer-events:none;
    z-index:0;
  }
  body::before{
    top:0; left:0;
    background:radial-gradient(ellipse at top left, rgba(143,161,147,0.18), rgba(143,161,147,0.07) 55%, transparent 75%);
  }
  body::after{
    bottom:0; right:0;
    background:radial-gradient(ellipse at bottom right, rgba(91,110,96,0.15), rgba(91,110,96,0.06) 55%, transparent 75%);
  }
  .wrap{position:relative;}
  .corner-knot{
    position:absolute;
    top:-18px; left:-42px;
    width:55px;height:100px;
    z-index:1;
    pointer-events:none;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 0 3rem;}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

  .hero{padding:1.5rem 0 1rem;text-align:center;}
  .hero h1{font-family:var(--serif);font-weight:400;font-size:26px;margin:0 0 4px;}
  .hero p{color:var(--text2);font-size:13px;margin:0;}

  .tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 1rem;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:0.5px solid var(--border);background:var(--surface);color:var(--text2);font-size:13px;cursor:pointer;white-space:nowrap;transition:background .15s;}
  .tab.active{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent-soft);font-weight:500;}
  .tab i{margin-right:5px;font-size:14px;vertical-align:-2px;}

  .panel{display:none;}
  .panel.active{display:block;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  .card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.25rem;margin-bottom:1rem;}
  .card h2{font-family:var(--serif);font-weight:400;font-size:18px;margin:0 0 4px;}
  .card .sub{color:var(--text2);font-size:12.5px;margin:0 0 1rem;}
  h3.section{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);margin:1.1rem 0 .5rem;font-weight:500;}
  h3.section:first-child{margin-top:0;}

  label.field-label{display:block;font-size:12.5px;color:var(--text2);margin-bottom:5px;}
  input[type=text], input[type=date], input[type=number], textarea, select{
    width:100%;font-family:var(--sans);font-size:14px;color:var(--text);
    background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-sm);
    padding:9px 10px;outline:none;
  }
  textarea{resize:vertical;min-height:64px;line-height:1.5;font-family:var(--serif);}
  input:focus, textarea:focus, select:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
  .field{margin-bottom:.85rem;}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;min-width:0;}

  button{font-family:var(--sans);font-size:13px;border-radius:var(--radius-sm);border:0.5px solid var(--border);background:var(--surface);color:var(--text);padding:8px 14px;cursor:pointer;transition:background .12s;}
  button:hover{background:var(--border-soft);}
  button:active{transform:scale(.98);}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  button.primary:hover{opacity:.9;background:var(--accent);}
  button.ghost{border-color:transparent;color:var(--text2);padding:4px 8px;}
  button.small{padding:5px 10px;font-size:12px;}
  .btn-row{display:flex;gap:8px;margin-top:.5rem;flex-wrap:wrap;}

  .pill-select{display:flex;gap:6px;flex-wrap:wrap;}
  .pill-select button{border-radius:999px;padding:6px 13px;font-size:13px;}
  .pill-select button.sel{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent-soft);font-weight:500;}

  .list-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--border-soft);}
  .list-item:last-child{border-bottom:none;}
  .list-item input[type=checkbox]{margin-top:3px;width:16px;height:16px;accent-color:var(--accent);flex:0 0 auto;}
  .list-item .txt{flex:1;font-size:14px;line-height:1.4;}
  .list-item .txt.done{text-decoration:line-through;color:var(--text3);}
  .list-item .del{flex:0 0 auto;color:var(--text3);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;}
  .list-item .del:hover{color:var(--coral);}

  .empty{color:var(--text3);font-size:13px;text-align:center;padding:1.2rem 0;font-style:italic;font-family:var(--serif);}

  .date-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:1rem;}
  .date-nav button{padding:6px 10px;font-size:15px;line-height:1;}
  .date-nav .date-label{font-size:14px;font-weight:500;min-width:170px;text-align:center;}
  .date-nav .today-btn{font-size:11.5px;color:var(--accent-text);background:var(--accent-soft);border-color:var(--accent-soft);padding:5px 10px;}
  .future-note{text-align:center;color:var(--text3);font-size:12px;margin:-0.4rem 0 1rem;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .metric{background:var(--bg);border-radius:var(--radius-sm);padding:.8rem;text-align:center;}
  .metric .n{font-size:20px;font-weight:500;font-family:var(--serif);}
  .metric .l{font-size:11.5px;color:var(--text2);margin-top:2px;}

  .mood-row{display:flex;gap:8px;justify-content:space-between;}
  .mood-btn{flex:1;text-align:center;padding:8px 4px;border-radius:var(--radius-sm);border:0.5px solid var(--border);background:var(--bg);cursor:pointer;font-size:20px;}
  .mood-btn.sel{background:var(--accent-soft);border-color:var(--accent);}

  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:.5rem;}
  .cal .d{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;background:var(--bg);color:var(--text3);cursor:pointer;border:0.5px solid transparent;}
  .cal .d.has{background:var(--accent-soft);color:var(--accent-text);font-weight:500;}
  .cal .d.today{border-color:var(--accent);}
  .cal .d.selected{outline:2px solid var(--accent);outline-offset:1px;}

  .archive-item{padding:12px 0;border-bottom:0.5px solid var(--border-soft);cursor:pointer;}
  .archive-item:last-child{border-bottom:none;}
  .archive-item:hover{background:var(--border-soft);margin:0 -1.25rem;padding:12px 1.25rem;}
  .archive-date{font-size:13px;font-weight:500;margin-bottom:2px;}
  .archive-preview{font-size:13px;color:var(--text2);line-height:1.5;font-family:var(--serif);}
  .archive-empty{font-style:italic;color:var(--text3);}
  .cal .dow{font-size:10px;color:var(--text3);text-align:center;}

  .pillar-card{background:var(--bg);border-radius:var(--radius-sm);padding:.9rem;margin-bottom:.7rem;position:relative;}
  .pillar-card .del{position:absolute;top:8px;right:8px;color:var(--text3);cursor:pointer;font-size:15px;}
  .pillar-card .del:hover{color:var(--coral);}
  .pillar-title{font-weight:500;font-size:14.5px;margin-bottom:3px;padding-right:20px;}
  .pillar-desc{font-size:13px;color:var(--text2);line-height:1.5;}
  .pillar-images{display:grid;grid-template-columns:repeat(auto-fill, minmax(72px, 1fr));gap:6px;margin-top:.7rem;}
  .pillar-img-wrap{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--border-soft);}
  .pillar-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .pillar-img-wrap .img-del{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;line-height:1;}
  .pillar-img-add{aspect-ratio:1;border-radius:8px;border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--text3);cursor:pointer;font-size:20px;background:transparent;}
  .pillar-img-add:hover{background:var(--border-soft);}
  .pillar-img-add input{display:none;}
  .img-count{font-size:11px;color:var(--text3);margin:5px 0 0;text-align:right;}

  .badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;font-weight:500;}
  .badge.mindful{background:var(--green-soft, #e7edcf);color:var(--green);}
  .badge.impulse{background:var(--coral-soft);color:var(--coral);}

  .spend-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:0.5px solid var(--border-soft);}
  .spend-item:last-child{border-bottom:none;}
  .spend-item .desc{flex:1;font-size:13.5px;}
  .spend-item .amt{font-weight:500;font-size:13.5px;}

  .trip-tabs{display:flex;gap:6px;margin-bottom:.9rem;}
  .trip-tabs button{flex:1;font-size:12.5px;padding:7px;}
  .trip-tabs button.sel{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent-soft);}

  .challenge-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:.6rem;}
  .cday{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;background:var(--bg);border:0.5px solid var(--border);cursor:pointer;color:var(--text2);}
  .cday.done{background:var(--green, #5c7a5c);color:#fff;border-color:var(--green,#5c7a5c);}

  .letter-tabs{display:flex;gap:6px;margin-bottom:.9rem;}
  .letter-tabs button{flex:1;font-size:12.5px;padding:7px;}
  .letter-tabs button.sel{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent-soft);}
  .letter-text{font-family:var(--serif);font-size:15px;line-height:1.8;min-height:220px;}

  .ach-item{padding:10px 0;border-bottom:0.5px solid var(--border-soft);}
  .ach-item:last-child{border-bottom:none;}
  .ach-item .date{font-size:11.5px;color:var(--text3);}
  .ach-item .t{font-size:14px;font-weight:500;margin:2px 0;}
  .ach-item .d{font-size:13px;color:var(--text2);}

  .save-note{font-size:11.5px;color:var(--text3);text-align:right;margin-top:4px;min-height:14px;}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;}
  .toast.show{opacity:1;}

  .auth-screen{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:2rem 1.25rem;}
  .auth-box{max-width:340px;width:100%;text-align:center;}
  .auth-box h1{font-family:var(--serif);font-weight:400;font-size:26px;margin:0 0 6px;}
  .auth-box p{color:var(--text2);font-size:13.5px;margin:0 0 1.4rem;line-height:1.5;}
  .auth-box input{margin-bottom:.7rem;text-align:center;}
  .auth-msg{font-size:12.5px;color:var(--green);margin-top:.8rem;min-height:16px;}
  .auth-msg.err{color:var(--coral);}
  .signout-row{text-align:center;padding:1rem 0 0;}
  .signout-row button{font-size:12px;color:var(--text3);}
</style>
</head>
<body>

<div id="auth-screen" class="auth-screen" style="display:none;">
  <div class="auth-box">
    <h1>Nya Journal</h1>
    <p>Enter your email and we'll send you a magic link to sign in — no password needed.</p>
    <input type="text" id="auth-email" placeholder="you@example.com" autocomplete="email">
    <button class="primary" id="auth-send" style="width:100%;">Send magic link</button>
    <p class="auth-msg" id="auth-msg"></p>
  </div>
</div>

async function sset(key, value){
  try{
    const { error } = await supa.from('journal_entries').upsert({
      user_id: currentUser.id,
      entry_key: key,
      entry_value: value,
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id,entry_key' });
    if(error) throw error;
    toast();
    return true;
  }catch(e){ console.error(e); toast('Save failed'); return false; }
}
async function sget(key, fallback){
  try{
    const { data, error } = await supa.from('journal_entries')
      .select('entry_value')
      .eq('user_id', currentUser.id)
      .eq('entry_key', key)
      .maybeSingle();
    if(error) throw error;
    return data ? data.entry_value : fallback;
  }catch(e){ console.error(e); return fallback; }
}
async function slist(prefix){
  try{
    const { data, error } = await supa.from('journal_entries')
      .select('entry_key')
      .eq('user_id', currentUser.id)
      .like('entry_key', prefix + '%');
    if(error) throw error;
    return data ? data.map(r=>r.entry_key) : [];
  }catch(e){ return []; }
}
async function sdel(key){
  try{
    await supa.from('journal_entries').delete()
      .eq('user_id', currentUser.id)
      .eq('entry_key', key);
  }catch(e){}
}

async function sendMagicLink(){
  const email = document.getElementById('auth-email').value.trim();
  const msg = document.getElementById('auth-msg');
  msg.classList.remove('err');
  if(!email || !email.includes('@')){
    msg.textContent = 'Enter a valid email address';
    msg.classList.add('err');

// Defensive fix: some email/link-scanning services mangle the redirect URL by
// appending a second "#" fragment, which breaks Supabase's automatic URL parser.
// This manually recovers a valid access_token if one is present anywhere in the URL.
async function recoverSessionFromMangledUrl(){
  const href = window.location.href;
  const tokenMatch = href.match(/access_token=([^&#]+)/);
  const refreshMatch = href.match(/refresh_token=([^&#]+)/);
  if(tokenMatch && refreshMatch){
    const { data, error } = await supa.auth.setSession({
      access_token: decodeURIComponent(tokenMatch[1]),
      refresh_token: decodeURIComponent(refreshMatch[1])
    });
    if(!error && data.session){
      window.history.replaceState({}, document.title, window.location.pathname);
      return true;
    }
  }
  return false;
}

supa.auth.onAuthStateChange((event, session)=>{
  if(session && session.user){
    if(!currentUser || currentUser.id !== session.user.id){
      showApp(session.user);
    }
  } else {
    showAuthScreen();
  }
});

(async ()=>{
  const recovered = await recoverSessionFromMangledUrl();
  if(recovered) return; // onAuthStateChange will fire and call showApp
  const { data: { session } } = await supa.auth.getSession();
  if(session && session.user){
    showApp(session.user);
  } else {
    if(window.location.href.includes('error=')){
      const msg = document.getElementById('auth-msg');
      if(msg){
        msg.textContent = 'That link expired or was already used — request a new one below.';
        msg.classList.add('err');
      }
    }
    showAuthScreen();
  }
})();

/* ---------------- VISION BOARD ---------------- */
const MAX_PILLAR_IMAGES = 6;
function resizeImageFile(file, maxDim){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

            <span class="txt"><strong style="font-weight:500;">${esc(w.place)}</strong>${w.note?' — '+esc(w.note):''}</span>
            <span class="del" data-i="${i}">&times;</span>
          </div>`).join('') : '<div class="empty">Nowhere on the list yet</div>'}
      </div>
      <div class="row" style="margin-top:.6rem;">
        <input type="text" id="w-place" placeholder="Where to?">
        <input type="text" id="w-note" placeholder="Why / notes">
      </div>
      <div class="btn-row"><button class="primary" id="w-add">Add to wishlist</button></div>
    `;
    document.getElementById('w-add').onclick = async ()=>{
      const place = document.getElementById('w-place').value.trim();
      if(!place) return;
      wishlist.push({place, note:document.getElementById('w-note').value.trim()});
      await sset('adv:wishlist', wishlist);
      renderAdventure();
    };
    document.querySelectorAll('#w-list .del').forEach(x=>{
      x.onclick = async ()=>{ wishlist.splice(Number(x.dataset.i),1); await sset('adv:wishlist', wishlist); renderAdventure(); };
    });
  } else if(adventureSub==='itinerary'){
    body.innerHTML = `
      <div id="i-list">
        ${itinerary.length ? itinerary.map((it,i)=>`
          <div class="list-item">
            <span class="txt"><strong style="font-weight:500;">${esc(it.day)}</strong> — ${esc(it.plan)}</span>
            <span class="del" data-i="${i}">&times;</span>
          </div>`).join('') : '<div class="empty">No itinerary items yet</div>'}
      </div>
      <div class="row" style="margin-top:.6rem;">
        <input type="text" id="i-day" placeholder="Day / date" style="max-width:130px;">
        <input type="text" id="i-plan" placeholder="Plan for this day">
      </div>
      <div class="btn-row"><button class="primary" id="i-add">Add stop</button></div>
    `;
    document.getElementById('i-add').onclick = async ()=>{
      const day = document.getElementById('i-day').value.trim();
      const plan = document.getElementById('i-plan').value.trim();
      if(!day || !plan) return;
      itinerary.push({day, plan});
      await sset('adv:itinerary', itinerary);
      renderAdventure();
    };
    document.querySelectorAll('#i-list .del').forEach(x=>{
      x.onclick = async ()=>{ itinerary.splice(Number(x.dataset.i),1); await sset('adv:itinerary', itinerary); renderAdventure(); };
    });
  } else {
    body.innerHTML = `
      <div id="p-list">
        ${packing.length ? packing.map((it,i)=>`
          <div class="list-item">
            <input type="checkbox" data-i="${i}" class="p-check" ${it.done?'checked':''}>
            <span class="txt ${it.done?'done':''}">${esc(it.item)}</span>
            <span class="del" data-i="${i}">&times;</span>
          </div>`).join('') : '<div class="empty">Packing list is empty</div>'}
      </div>
      <div class="row" style="margin-top:.6rem;">
        <input type="text" id="p-item" placeholder="Add an item...">
        <button id="p-add" style="flex:0 0 auto;">Add</button>
      </div>
    `;
    document.getElementById('p-add').onclick = async ()=>{
      const item = document.getElementById('p-item').value.trim();
      if(!item) return;
      packing.push({item, done:false});
      await sset('adv:packing', packing);
      renderAdventure();
    };
    document.querySelectorAll('.p-check').forEach(c=>{
      c.onchange = async ()=>{ packing[Number(c.dataset.i)].done = c.checked; await sset('adv:packing', packing); renderAdventure(); };
    });
    document.querySelectorAll('#p-list .del').forEach(x=>{
      x.onclick = async ()=>{ packing.splice(Number(x.dataset.i),1); await sset('adv:packing', packing); renderAdventure(); };
    });
  }
}

/* ---------------- SELF CARE ---------------- */
async function renderSelfcare(){
  const p = document.getElementById('panel-selfcare');
  const challenge = await sget('selfcare:challenge', {name:'', days:{}, active:false});
  const dayCells = Array.from({length:30}, (_,i)=>i+1).map(d=>{
    const done = !!challenge.days[d];
    return `<div class="cday ${done?'done':''}" data-d="${d}">${d}</div>`;
  }).join('');
  const doneCount = Object.values(challenge.days||{}).filter(Boolean).length;

  p.innerHTML = `
    <div class="card">
      <h2>Self care</h2>
      <p class="sub">A 30-day challenge to build a nourishing daily practice</p>
      <div class="field">
        <label class="field-label">Challenge name</label>
        <input type="text" id="sc-name" placeholder="e.g. 10 minutes of quiet each morning" value="${escAttr(challenge.name)}">
      </div>
      <div class="btn-row"><button class="primary small" id="sc-save-name">Save name</button></div>
      <h3 class="section">Progress — ${doneCount}/30 days</h3>
      <div class="challenge-grid">${dayCells}</div>
    </div>
  `;
  document.getElementById('sc-save-name').onclick = async ()=>{
    challenge.name = document.getElementById('sc-name').value;
    await sset('selfcare:challenge', challenge);
    toast();
  };
  document.querySelectorAll('.cday').forEach(c=>{
    c.onclick = async ()=>{
      const d = c.dataset.d;
      challenge.days[d] = !challenge.days[d];
      await sset('selfcare:challenge', challenge);
      renderSelfcare();
    };
  });
}

/* ---------------- LETTERS ---------------- */
let letterSub = 'to';
async function renderLetters(){
  const p = document.getElementById('panel-letters');
  const toFuture = await sget('letter:to', '');
  const fromFuture = await sget('letter:from', '');
  const howFar = await sget('letter:howfar', '');

  p.innerHTML = `
    <div class="card">
      <h2>Letters</h2>
      <p class="sub">Words across time — to yourself, from yourself, and looking back</p>
      <div class="letter-tabs">
        <button data-s="to" class="${letterSub==='to'?'sel':''}">To future self</button>
        <button data-s="from" class="${letterSub==='from'?'sel':''}">From future self</button>
        <button data-s="howfar" class="${letterSub==='howfar'?'sel':''}">How far I've come</button>
      </div>
      <textarea class="letter-text" id="l-text" placeholder="${letterSub==='to' ? 'Dear future me...' : letterSub==='from' ? 'Imagine your future self writing back to you today...' : 'Reflect on how far you have come...'}"></textarea>
      <div class="btn-row"><button class="primary" id="l-save">Save letter</button></div>
    </div>
  `;
  const map = {to:toFuture, from:fromFuture, howfar:howFar};
  document.getElementById('l-text').value = map[letterSub] || '';

  document.querySelectorAll('.letter-tabs button').forEach(b=>{
    b.onclick = ()=>{ letterSub = b.dataset.s; renderLetters(); };
  });
  document.getElementById('l-save').onclick = async ()=>{
    const key = letterSub==='to' ? 'letter:to' : letterSub==='from' ? 'letter:from' : 'letter:howfar';
    await sset(key, document.getElementById('l-text').value);
  };
}

/* ---------------- CAREER ---------------- */
async function renderCareer(){
  const p = document.getElementById('panel-career');
  const plan = await sget('career:plan', {role:'', vision:'', skills:'', nextSteps:''});
  const achievements = await sget('career:achievements', []);

  p.innerHTML = `
    <div class="card">
      <h2>Career planner</h2>
      <p class="sub">Where you're headed and how you'll get there</p>
      <div class="field"><label class="field-label">Current role / focus</label><input type="text" id="c-role" value="${escAttr(plan.role)}"></div>
      <div class="field"><label class="field-label">Where I want to be</label><textarea id="c-vision">${esc(plan.vision)}</textarea></div>
      <div class="field"><label class="field-label">Skills to build</label><textarea id="c-skills">${esc(plan.skills)}</textarea></div>
      <div class="field"><label class="field-label">Next steps</label><textarea id="c-next">${esc(plan.nextSteps)}</textarea></div>
      <div class="btn-row"><button class="primary" id="c-save">Save plan</button></div>
    </div>
    <div class="card">
      <h2>Achievements</h2>
      <p class="sub">Capture the wins, big and small</p>
      <div id="ach-list">
        ${achievements.length ? achievements.slice().reverse().map((a,ri)=>{
          const i = achievements.length-1-ri;
          return `<div class="ach-item">
            <div class="date">${esc(a.date)} <span class="del" data-i="${i}" style="float:right;cursor:pointer;color:var(--text3);">&times;</span></div>
            <div class="t">${esc(a.title)}</div>
            ${a.desc?`<div class="d">${esc(a.desc)}</div>`:''}
          </div>`;
        }).join('') : '<div class="empty">No achievements captured yet</div>'}
      </div>
      <h3 class="section">Add an achievement</h3>
      <div class="field"><input type="text" id="a-title" placeholder="What did you achieve?"></div>
      <div class="field"><textarea id="a-desc" placeholder="Details (optional)"></textarea></div>
      <div class="btn-row"><button class="primary" id="a-add">Add achievement</button></div>
    </div>
  `;
  document.getElementById('c-save').onclick = async ()=>{
    await sset('career:plan', {
      role: document.getElementById('c-role').value,
      vision: document.getElementById('c-vision').value,
      skills: document.getElementById('c-skills').value,
      nextSteps: document.getElementById('c-next').value,
    });
  };
  document.getElementById('a-add').onclick = async ()=>{
    const title = document.getElementById('a-title').value.trim();
    if(!title) return;
    achievements.push({title, desc:document.getElementById('a-desc').value.trim(), date: new Date().toLocaleDateString(undefined,{month:'short', day:'numeric', year:'numeric'})});
    await sset('career:achievements', achievements);
    renderCareer();
  };
  document.querySelectorAll('#ach-list .del').forEach(x=>{
    x.onclick = async ()=>{
      achievements.splice(Number(x.dataset.i),1);
      await sset('career:achievements', achievements);
      renderCareer();
    };
  });
}

/* ---------------- ARCHIVE ---------------- */
async function renderArchive(){
  const p = document.getElementById('panel-archive');
  p.innerHTML = `<div class="card"><p class="empty">Loading your entries…</p></div>`;

  const [dailyKeys, journalKeys] = await Promise.all([
    slist('daily:'),
    slist('journal:')
  ]);

  const dates = new Set();
  dailyKeys.forEach(k=>dates.add(k.slice('daily:'.length)));
  journalKeys.forEach(k=>dates.add(k.slice('journal:'.length)));

  const sortedDates = Array.from(dates).sort().reverse();

  if(sortedDates.length === 0){
    p.innerHTML = `<div class="card"><p class="empty">No entries yet — write something in Daily Rituals or Monthly and it'll show up here.</p></div>`;
    return;
  }

  const entries = await Promise.all(sortedDates.map(async (dateStr)=>{
    const [dailyData, journalText] = await Promise.all([
      sget('daily:'+dateStr, null),
      sget('journal:'+dateStr, '')
    ]);
    let snippet = '';
    if(dailyData && dailyData.focus) snippet = dailyData.focus;
    else if(dailyData && dailyData.wentWell) snippet = dailyData.wentWell;
    else if(journalText) snippet = journalText;
    snippet = (snippet || '').trim();
    const preview = snippet.length > 110 ? snippet.slice(0,110).trim()+'…' : snippet;
    return { dateStr, preview, hasDaily: !!dailyData, hasJournal: !!journalText };
  }));

  p.innerHTML = `
    <div class="card">
      <h2>Archive</h2>
      <p class="sub">Every day you've written something, newest first</p>
      <div id="archive-list">
        ${entries.map(e=>`
          <div class="archive-item" data-date="${e.dateStr}">
            <div class="archive-date">${formatDateLabel(e.dateStr)}</div>
            <div class="archive-preview">${e.preview ? esc(e.preview) : '<span class="archive-empty">No written entry — mood only</span>'}</div>
          </div>`).join('')}
      </div>
    </div>
  `;

  document.querySelectorAll('.archive-item').forEach(item=>{
    item.onclick = ()=>{
      const d = item.dataset.date;
      dailyViewDate = d;
      monthlyViewDate = d;
      showTab('daily');
      renderDaily();
    };
  });
}

function esc(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }

async function init(){
  showTab('daily');
  await renderDaily();
  await renderMonthly();
  await renderArchive();
  await renderVision();
  await renderFinance();
  await renderAdventure();
  await renderSelfcare();
  await renderLetters();
  await renderCareer();
}
</script>
