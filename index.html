<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Journal Hub</title>
<style>
  :root{
    --bg:#faf8f4; --surface:#ffffff; --border:#e5e0d8; --border-soft:#efece5;
    --text:#2c2a26; --text2:#6b6558; --text3:#a39d8e;
    --accent:#7f6a4f; --accent-soft:#efe6d8; --accent-text:#5c4a33;
    --green:#5c7a5c; --green-soft:#e7edcf;
    --coral:#c1704f; --coral-soft:#f6e5db;
    --radius:14px; --radius-sm:9px;
    --serif: Georgia, 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1c1a17; --surface:#252220; --border:#3a352e; --border-soft:#2e2b26;
      --text:#ece7dc; --text2:#a39d8e; --text3:#756f61;
      --accent:#c7ab7f; --accent-soft:#3a3226; --accent-text:#e0c99a;
      --green:#8fae8a; --coral:#d98d6a; --coral-soft:#3a2a20;
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);}
  .wrap{max-width:760px;margin:0 auto;padding:0 0 3rem;}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

  .hero{padding:1.5rem 0 1rem;text-align:center;}
  .hero h1{font-family:var(--serif);font-weight:400;font-size:26px;margin:0 0 4px;}
  .hero p{color:var(--text2);font-size:13px;margin:0;}

  .tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 1rem;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:0.5px solid var(--border);background:var(--surface);color:var(--text2);font-size:13px;cursor:pointer;white-space:nowrap;transition:background .15s;}
  .tab.active{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent-soft);font-weight:500;}
  .tab i{margin-right:5px;font-size:14px;vertical-align:-2px;}

  .panel{display:none;}
  .panel.active{display:block;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  .card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.25rem;margin-bottom:1rem;}
  .card h2{font-family:var(--serif);font-weight:400;font-size:18px;margin:0 0 4px;}
  .card .sub{color:var(--text2);font-size:12.5px;margin:0 0 1rem;}
  h3.section{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);margin:1.1rem 0 .5rem;font-weight:500;}
  h3.section:first-child{margin-top:0;}

  label.field-label{display:block;font-size:12.5px;color:var(--text2);margin-bottom:5px;}
  input[type=text], input[type=date], input[type=number], textarea, select{
    width:100%;font-family:var(--sans);font-size:14px;color:var(--text);
    background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-sm);
    padding:9px 10px;outline:none;
  }
  textarea{resize:vertical;min-height:64px;line-height:1.5;font-family:var(--serif);}
  input:focus, textarea:focus, select:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
  .field{margin-bottom:.85rem;}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;min-width:0;}

  button{font-family:var(--sans);font-size:13px;border-radius:var(--radius-sm);border:0.5px solid var(--border);background:var(--surface);color:var(--text);padding:8px 14px;cursor:pointer;transition:background .12s;}
  button:hover{background:var(--border-soft);}
  button:active{transform:scale(.98);}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  button.primary:hover{opacity:.9;background:var(--accent);}
  button.ghost{border-color:transparent;color:var(--text2);padding:4px 8px;}
  button.small{padding:5px 10px;font-size:12px;}
  .btn-row{display:flex;gap:8px;margin-top:.5rem;flex-wrap:wrap;}

  .pill-select{display:flex;gap:6px;flex-wrap:wrap;}
  .pill-select button{border-radius:999px;padding:6px 13px;font-size:13px;}
  .pill-select button.sel{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent-soft);font-weight:500;}

  .list-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--border-soft);}
  .list-item:last-child{border-bottom:none;}
  .list-item input[type=checkbox]{margin-top:3px;width:16px;height:16px;accent-color:var(--accent);flex:0 0 auto;}
  .list-item .txt{flex:1;font-size:14px;line-height:1.4;}
  .list-item .txt.done{text-decoration:line-through;color:var(--text3);}
  .list-item .del{flex:0 0 auto;color:var(--text3);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;}
  .list-item .del:hover{color:var(--coral);}

  .empty{color:var(--text3);font-size:13px;text-align:center;padding:1.2rem 0;font-style:italic;font-family:var(--serif);}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .metric{background:var(--bg);border-radius:var(--radius-sm);padding:.8rem;text-align:center;}
  .metric .n{font-size:20px;font-weight:500;font-family:var(--serif);}
  .metric .l{font-size:11.5px;color:var(--text2);margin-top:2px;}

  .mood-row{display:flex;gap:8px;justify-content:space-between;}
  .mood-btn{flex:1;text-align:center;padding:8px 4px;border-radius:var(--radius-sm);border:0.5px solid var(--border);background:var(--bg);cursor:pointer;font-size:20px;}
  .mood-btn.sel{background:var(--accent-soft);border-color:var(--accent);}

  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:.5rem;}
  .cal .d{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;background:var(--bg);color:var(--text3);cursor:pointer;border:0.5px solid transparent;}
  .cal .d.has{background:var(--accent-soft);color:var(--accent-text);font-weight:500;}
  .cal .d.today{border-color:var(--accent);}
  .cal .dow{font-size:10px;color:var(--text3);text-align:center;}

  .pillar-card{background:var(--bg);border-radius:var(--radius-sm);padding:.9rem;margin-bottom:.7rem;position:relative;}
  .pillar-card .del{position:absolute;top:8px;right:8px;color:var(--text3);cursor:pointer;font-size:15px;}
  .pillar-card .del:hover{color:var(--coral);}
  .pillar-title{font-weight:500;font-size:14.5px;margin-bottom:3px;padding-right:20px;}
  .pillar-desc{font-size:13px;color:var(--text2);line-height:1.5;}
  .pillar-images{display:grid;grid-template-columns:repeat(auto-fill, minmax(72px, 1fr));gap:6px;margin-top:.7rem;}
  .pillar-img-wrap{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--border-soft);}
  .pillar-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .pillar-img-wrap .img-del{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;line-height:1;}
  .pillar-img-add{aspect-ratio:1;border-radius:8px;border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--text3);cursor:pointer;font-size:20px;background:transparent;}
  .pillar-img-add:hover{background:var(--border-soft);}
  .pillar-img-add input{display:none;}
  .img-count{font-size:11px;color:var(--text3);margin:5px 0 0;text-align:right;}

  .badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;font-weight:500;}
  .badge.mindful{background:var(--green-soft, #e7edcf);color:var(--green);}
  .badge.impulse{background:var(--coral-soft);color:var(--coral);}

  .spend-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:0.5px solid var(--border-soft);}
  .spend-item:last-child{border-bottom:none;}
  .spend-item .desc{flex:1;font-size:13.5px;}
  .spend-item .amt{font-weight:500;font-size:13.5px;}

  .trip-tabs{display:flex;gap:6px;margin-bottom:.9rem;}
  .trip-tabs button{flex:1;font-size:12.5px;padding:7px;}
  .trip-tabs button.sel{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent-soft);}

  .challenge-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:.6rem;}
  .cday{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;background:var(--bg);border:0.5px solid var(--border);cursor:pointer;color:var(--text2);}
  .cday.done{background:var(--green, #5c7a5c);color:#fff;border-color:var(--green,#5c7a5c);}

  .letter-tabs{display:flex;gap:6px;margin-bottom:.9rem;}
  .letter-tabs button{flex:1;font-size:12.5px;padding:7px;}
  .letter-tabs button.sel{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent-soft);}
  .letter-text{font-family:var(--serif);font-size:15px;line-height:1.8;min-height:220px;}

  .ach-item{padding:10px 0;border-bottom:0.5px solid var(--border-soft);}
  .ach-item:last-child{border-bottom:none;}
  .ach-item .date{font-size:11.5px;color:var(--text3);}
  .ach-item .t{font-size:14px;font-weight:500;margin:2px 0;}
  .ach-item .d{font-size:13px;color:var(--text2);}

  .save-note{font-size:11.5px;color:var(--text3);text-align:right;margin-top:4px;min-height:14px;}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;}
  .toast.show{opacity:1;}

  .auth-screen{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:2rem 1.25rem;}
  .auth-box{max-width:340px;width:100%;text-align:center;}
  .auth-box h1{font-family:var(--serif);font-weight:400;font-size:26px;margin:0 0 6px;}
  .auth-box p{color:var(--text2);font-size:13.5px;margin:0 0 1.4rem;line-height:1.5;}
  .auth-box input{margin-bottom:.7rem;text-align:center;}
  .auth-msg{font-size:12.5px;color:var(--green);margin-top:.8rem;min-height:16px;}
  .auth-msg.err{color:var(--coral);}
  .signout-row{text-align:center;padding:1rem 0 0;}
  .signout-row button{font-size:12px;color:var(--text3);}
</style>
</head>

<script>
const TABS = [
  {id:'daily', label:'Daily rituals', icon:'ti-sun'},
  {id:'monthly', label:'Monthly', icon:'ti-calendar'},
  {id:'vision', label:'Vision board', icon:'ti-compass'},

const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');
TABS.forEach(t=>{
  const b = document.createElement('button');
  b.className='tab'; b.id='tabbtn-'+t.id; b.setAttribute('role','tab');

function showTab(id){

    document.getElementById('tabbtn-'+t.id).classList.toggle('active', t.id===id);
    document.getElementById('panel-'+t.id).classList.toggle('active', t.id===id);
  });

const todayKey = ()=> new Date().toISOString().slice(0,10);
const monthKey = ()=> new Date().toISOString().slice(0,7);
document.getElementById('dateLine').textContent = new Date().toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric', year:'numeric'});

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg||'Saved';
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 1400);
}

async function sset(key, value){
  try{
    const { error } = await supa.from('journal_entries').upsert({
      user_id: currentUser.id,
      entry_key: key,
      entry_value: value,
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id,entry_key' });
    if(error) throw error;
    toast();
    return true;
  }catch(e){ console.error(e); toast('Save failed'); return false; }
}
async function sget(key, fallback){
  try{
    const { data, error } = await supa.from('journal_entries')
      .select('entry_value')
      .eq('user_id', currentUser.id)
      .eq('entry_key', key)
      .maybeSingle();
    if(error) throw error;
    return data ? data.entry_value : fallback;
  }catch(e){ console.error(e); return fallback; }
}
async function slist(prefix){
  try{
    const { data, error } = await supa.from('journal_entries')
      .select('entry_key')
      .eq('user_id', currentUser.id)
      .like('entry_key', prefix + '%');
    if(error) throw error;
    return data ? data.map(r=>r.entry_key) : [];
  }catch(e){ return []; }
}
async function sdel(key){
  try{
    await supa.from('journal_entries').delete()
      .eq('user_id', currentUser.id)
      .eq('entry_key', key);
  }catch(e){}
}

/* ---------------- AUTH ---------------- */
async function sendMagicLink(){
  const email = document.getElementById('auth-email').value.trim();
  const msg = document.getElementById('auth-msg');
  msg.classList.remove('err');
  if(!email || !email.includes('@')){
    msg.textContent = 'Enter a valid email address';
    msg.classList.add('err');
    return;
  }
  document.getElementById('auth-send').disabled = true;
  const { error } = await supa.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: window.location.href }
  });
  document.getElementById('auth-send').disabled = false;
  if(error){
    msg.textContent = error.message;
    msg.classList.add('err');
  } else {
    msg.textContent = 'Check your email for a sign-in link.';
  }
}

async function showApp(user){
  currentUser = user;
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app-root').style.display = 'block';
  await init();
}

function showAuthScreen(){
  currentUser = null;
  document.getElementById('app-root').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
}

document.getElementById('auth-send').onclick = sendMagicLink;
document.getElementById('auth-email').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') sendMagicLink();
});
document.getElementById('signout-btn').onclick = async ()=>{
  await supa.auth.signOut();
  showAuthScreen();
};

// Defensive fix: some email/link-scanning services mangle the redirect URL by
// appending a second "#" fragment, which breaks Supabase's automatic URL parser.
// This manually recovers a valid access_token if one is present anywhere in the URL.
async function recoverSessionFromMangledUrl(){
  const href = window.location.href;
  const tokenMatch = href.match(/access_token=([^&#]+)/);
  const refreshMatch = href.match(/refresh_token=([^&#]+)/);
  if(tokenMatch && refreshMatch){
    const { data, error } = await supa.auth.setSession({
      access_token: decodeURIComponent(tokenMatch[1]),
      refresh_token: decodeURIComponent(refreshMatch[1])
    });
    if(!error && data.session){
      window.history.replaceState({}, document.title, window.location.pathname);
      return true;
    }
  }
  return false;
}

supa.auth.onAuthStateChange((event, session)=>{
  if(session && session.user){
    if(!currentUser || currentUser.id !== session.user.id){
      showApp(session.user);
    }
  } else {
    showAuthScreen();
  }
});

(async ()=>{
  const recovered = await recoverSessionFromMangledUrl();
  if(recovered) return; // onAuthStateChange will fire and call showApp
  const { data: { session } } = await supa.auth.getSession();
  if(session && session.user){
    showApp(session.user);
  } else {
    if(window.location.href.includes('error=')){
      const msg = document.getElementById('auth-msg');
      if(msg){
        msg.textContent = 'That link expired or was already used — request a new one below.';
        msg.classList.add('err');
      }
    }
    showAuthScreen();
  }
})();

/* ---------------- DAILY RITUALS ---------------- */
async function renderDaily(){
  const p = document.getElementById('panel-daily');
  const key = 'daily:'+todayKey();
  const data = await sget(key, {focus:'', priorities:['','',''], grateful:'', wentWell:'', improve:'', tomorrow:''});
  p.innerHTML = `
    <div class="card">
      <h2>Morning focus</h2>
      <p class="sub">Set the tone before the day sets it for you</p>
      <div class="field">
        <label class="field-label">Today I'm focused on</label>
        <textarea id="d-focus" placeholder="One sentence to anchor the day...">${esc(data.focus)}</textarea>
      </div>
      <h3 class="section">Top 3 priorities</h3>
      ${[0,1,2].map(i=>`<div class="field"><input type="text" id="d-pri-${i}" placeholder="Priority ${i+1}" value="${escAttr(data.priorities[i]||'')}"></div>`).join('')}
    </div>
    <div class="card">
      <h2>Evening check-in</h2>
      <p class="sub">Close the day with a little reflection</p>
      <div class="field"><label class="field-label">What went well</label><textarea id="d-well" placeholder="...">${esc(data.wentWell)}</textarea></div>
      <div class="field"><label class="field-label">What I'd do differently</label><textarea id="d-improve" placeholder="...">${esc(data.improve)}</textarea></div>
      <div class="field"><label class="field-label">Grateful for</label><textarea id="d-grateful" placeholder="...">${esc(data.grateful)}</textarea></div>
      <div class="field"><label class="field-label">One thing for tomorrow</label><input type="text" id="d-tomorrow" value="${escAttr(data.tomorrow)}"></div>
    </div>
    <div class="btn-row"><button class="primary" id="d-save">Save today's entry</button></div>
  `;
  document.getElementById('d-save').onclick = async ()=>{
    const out = {
      focus: document.getElementById('d-focus').value,
      priorities: [0,1,2].map(i=>document.getElementById('d-pri-'+i).value),
      wentWell: document.getElementById('d-well').value,
      improve: document.getElementById('d-improve').value,
      grateful: document.getElementById('d-grateful').value,
      tomorrow: document.getElementById('d-tomorrow').value,
    };
    await sset(key, out);
  };
}

/* ---------------- MONTHLY PLANNER ---------------- */
const MOODS = ['😔','😕','😐','🙂','😄'];
async function renderMonthly(){
  const p = document.getElementById('panel-monthly');
  const mk = monthKey();
  const goals = await sget('goals:'+mk, []);
  const moodMap = await sget('mood:'+mk, {});
  const journalToday = await sget('journal:'+todayKey(), '');

  const [y,m] = mk.split('-').map(Number);
  const firstDow = new Date(y, m-1, 1).getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const monthName = new Date(y, m-1, 1).toLocaleDateString(undefined,{month:'long', year:'numeric'});

  let calDays = '';
  for(let i=0;i<firstDow;i++) calDays += `<div></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dk = `${mk}-${String(d).padStart(2,'0')}`;
    const has = moodMap[dk];
    const isToday = dk === todayKey();
    calDays += `<div class="d ${has?'has':''} ${isToday?'today':''}" data-day="${dk}" title="${has?MOODS[has-1]:''}">${has?MOODS[has-1]:d}</div>`;
  }

  p.innerHTML = `
    <div class="card">
      <h2>Mood — today</h2>
      <p class="sub">${new Date().toLocaleDateString(undefined,{weekday:'long'})}</p>

/* ---------------- VISION BOARD ---------------- */
const MAX_PILLAR_IMAGES = 6;
function resizeImageFile(file, maxDim){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function renderVision(){
  const p = document.getElementById('panel-vision');
  const pillars = await sget('vision:pillars', []);
  p.innerHTML = `
    <div class="card">
      <h2>Vision board</h2>
      <p class="sub">The pillars of the life you're building — keep them front of mind</p>
      <div id="pillar-list">
        ${pillars.length ? pillars.map((pl,i)=>`
          <div class="pillar-card">
            <span class="del" data-i="${i}" data-role="pillar-del">&times;</span>
            <div class="pillar-title">${esc(pl.title)}</div>
            <div class="pillar-desc">${esc(pl.desc)}</div>
            <div class="pillar-images">
              ${(pl.images||[]).map((src,ii)=>`
                <div class="pillar-img-wrap">
                  <img src="${src}" alt="">
                  <div class="img-del" data-pi="${i}" data-ii="${ii}" data-role="img-del">&times;</div>
                </div>`).join('')}
              ${(pl.images||[]).length < MAX_PILLAR_IMAGES ? `
              <label class="pillar-img-add" data-pi="${i}">
                <i class="ti ti-plus" aria-hidden="true"></i>
                <input type="file" accept="image/*" data-pi="${i}" class="img-input">
              </label>` : ''}
            </div>
            <p class="img-count">${(pl.images||[]).length}/${MAX_PILLAR_IMAGES} images</p>
          </div>`).join('') : '<div class="empty">No pillars yet — define your first one below</div>'}
      </div>
      <h3 class="section">Add a pillar</h3>
      <div class="field"><input type="text" id="v-title" placeholder="e.g. Health, Craft, Connection"></div>
      <div class="field"><textarea id="v-desc" placeholder="What this means to you, and how you'll know you're living it"></textarea></div>
      <div class="btn-row"><button class="primary" id="v-add">Add pillar</button></div>
    </div>
  `;
  document.getElementById('v-add').onclick = async ()=>{
    const t = document.getElementById('v-title').value.trim();
    const d = document.getElementById('v-desc').value.trim();
    if(!t) return;
    pillars.push({title:t, desc:d, images:[]});
    await sset('vision:pillars', pillars);
    renderVision();
  };
  document.querySelectorAll('[data-role="pillar-del"]').forEach(x=>{
    x.onclick = async ()=>{
      pillars.splice(Number(x.dataset.i),1);
      await sset('vision:pillars', pillars);
      renderVision();
    };
  });
  document.querySelectorAll('[data-role="img-del"]').forEach(x=>{
    x.onclick = async ()=>{
      const pi = Number(x.dataset.pi), ii = Number(x.dataset.ii);
      pillars[pi].images.splice(ii,1);
      await sset('vision:pillars', pillars);
      renderVision();
    };
  });
  document.querySelectorAll('.img-input').forEach(inp=>{
    inp.onchange = async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const pi = Number(inp.dataset.pi);
      if(!pillars[pi].images) pillars[pi].images = [];
      if(pillars[pi].images.length >= MAX_PILLAR_IMAGES){
        toast(`Limit is ${MAX_PILLAR_IMAGES} images per pillar`);
        return;
      }
      try{
        const dataUrl = await resizeImageFile(file, 640);
        pillars[pi].images.push(dataUrl);
        await sset('vision:pillars', pillars);
        renderVision();
      }catch(err){
        toast('Could not add image');
      }
    };
  });
}

    const amt = document.getElementById('f-amt').value;
    if(!desc || !amt) return;
    spends.push({desc, amt, type:selType, date:todayKey()});
    await sset('spend:'+mk, spends);
    renderFinance();

    x.onclick = async ()=>{

function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }
